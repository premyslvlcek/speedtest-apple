#
# SwiftLint configuration
#

included:
  - SpeedTest
  - SpeedTestPackage/Sources
  - SpeedTestPackage/Tests
  - SpeedTestUITests

excluded:
  - "**/.build"
  - "**/.swiftpm"
  - "**/DerivedData"

disabled_rules:
  # SwiftUI's `Button { … } label: { … }` is the idiomatic form this rule flags.
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - array_init
  - closure_spacing
  - conditional_returns_on_newline
  - contains_over_first_not_nil
  - convenience_type
  - empty_count
  - empty_string
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - force_unwrapping
  - implicitly_unwrapped_optional
  - implicit_return
  - modifier_order
  - sorted_imports
  - toggle_bool
  - unavailable_function

line_length:
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true
  warning: 120

custom_rules:
  force_https:
    name: "Force HTTPS over HTTP"
    regex: "((?i)http(?!s))"
    match_kinds: string
    message: "HTTPS should be favored over HTTP"
    severity: warning
