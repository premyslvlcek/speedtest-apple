#
# SwiftLint configuration
#

included:
  - SpeedTest
  - SpeedTestPackage/Sources
  - SpeedTestPackage/Tests
  - SpeedTestUITests

excluded:
  - "**/.build"
  - "**/.swiftpm"
  - "**/DerivedData"

disabled_rules:
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - array_init
  - closure_spacing
  - conditional_returns_on_newline
  - contains_over_first_not_nil
  - convenience_type
  - empty_count
  - empty_string
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - force_unwrapping
  - implicitly_unwrapped_optional
  - implicit_return
  - modifier_order
  - sorted_imports
  - toggle_bool
  - unavailable_function

vertical_whitespace:
  max_empty_lines: 1

force_cast: error

identifier_name:
  excluded:
    - to
    - id
    - ui
    - on
    - db
    - ms
    - ip
    - x
    - y
    - i
  allowed_symbols: "_"

empty_count: warning

trailing_whitespace:
  ignores_empty_lines: true

line_length:
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true
  error: 150
  warning: 120

function_body_length:
  error: 150
  warning: 100

type_body_length:
  error: 900
  warning: 600

file_length:
  error: 1000
  warning: 900

function_parameter_count:
  warning: 7
  error: 8

cyclomatic_complexity:
  ignores_case_statements: true

large_tuple:
  error: 8
  warning: 7

nesting:
  type_level: 3
  function_level: 4

custom_rules:
  comments_space:
    name: "Space After Comment"
    regex: "(^ *//\\w+)"
    message: "There should be a space after //"
    severity: warning

  force_https:
    name: "Force HTTPS over HTTP"
    regex: "((?i)http(?!s))"
    match_kinds: string
    message: "HTTPS should be favored over HTTP"
    severity: warning

  double_space:
    include: "*.swift"
    name: "Double space"
    regex: "([a-z,A-Z] \\s+)"
    message: "Double space between keywords"
    match_kinds: keyword
    severity: warning
