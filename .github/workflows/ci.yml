name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Cache Mint
        uses: actions/cache@v4
        with:
          path: ~/.mint
          key: mint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Mintfile') }}

      - name: Install tools
        run: |
          brew list mint >/dev/null 2>&1 || brew install mint
          mint bootstrap

      - name: SwiftLint
        run: ./swiftlint.sh

      - name: SwiftFormat
        if: ${{ !cancelled() }}
        run: ./swiftformat.sh --lint

  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The toolchain the project is developed with.
          - name: Xcode 26.6 (iOS 26.5, macOS)
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app
            ios-destination: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5
          # The newest toolchain (Swift 6.4, iOS 27 SDK). Packages re-resolve here on purpose: under Swift 6.4
          # the Point-Free packages pick their tools-6.4 manifests, so the committed Package.resolved differs.
          - name: Xcode 27.0 (iOS 27.0, macOS 27)
            runner: xcode-27
            xcode: /Applications/Xcode_27.0.app
            ios-destination: platform=iOS Simulator,name=iPhone 17,OS=27.0
    env:
      IOS_DESTINATION: ${{ matrix.ios-destination }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "${{ matrix.xcode }}"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Package tests (macOS)
        run: |
          set -o pipefail
          swift test --package-path SpeedTestPackage 2>&1 | tee swift-test-macos.log
          .github/scripts/check-warnings.sh swift-test-macos.log

      - name: Package tests (iOS)
        working-directory: SpeedTestPackage
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SpeedTestPackage-Package \
            -destination "$IOS_DESTINATION" \
            -skipMacroValidation \
            -skip-testing:SpeedTestFeatureTests/SnapshotTests \
            -quiet 2>&1 | tee ../package-tests-ios.log
          ../.github/scripts/check-warnings.sh ../package-tests-ios.log

      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild build \
            -project SpeedTest.xcodeproj \
            -scheme SpeedTest \
            -destination "$IOS_DESTINATION" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            -quiet 2>&1 | tee build-ios.log
          .github/scripts/check-warnings.sh build-ios.log

      - name: Build macOS app
        run: |
          set -o pipefail
          xcodebuild build \
            -project SpeedTest.xcodeproj \
            -scheme SpeedTest \
            -destination 'platform=macOS' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            -quiet 2>&1 | tee build-macos.log
          .github/scripts/check-warnings.sh build-macos.log
